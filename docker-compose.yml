services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: git-hired-dev
    ports:
      - "3000:3000"
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      GITHUB_CALLBACK_URL: http://localhost:5173/auth/github/callback
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - app_data:/app/data
    restart: unless-stopped

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: git-hired-prod
    profiles:
      - prod
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ""
      GITHUB_CALLBACK_URL: http://localhost:3000/auth/github/callback
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  node_modules:
  client_node_modules:
  app_data:
