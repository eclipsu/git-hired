# Production-only compose (no --profile flag needed).
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# After first deploy, seed landing page stats from saved versions (optional):
#   docker compose -f docker-compose.prod.yml exec app node dist/cli/backfillPlatformStats.js
#
# Verify public stats: curl http://localhost:4000/api/stats/public

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gitapply-prod
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
